<text x="32" y="74" style="animation:a0 14s infinite" xml:space="preserve"><tspan fill="#c792ea">model</tspan> <tspan fill="#ffcb6b">User</tspan> { id: <tspan fill="#ffcb6b">int</tspan>, name: <tspan fill="#ffcb6b">string</tspan>, score: <tspan fill="#ffcb6b">int</tspan> }</text>
<text x="32" y="93" style="animation:a1 14s infinite" xml:space="preserve"></text>
<text x="32" y="112" style="animation:a2 14s infinite" xml:space="preserve"><tspan fill="#c792ea">signal</tspan> minScore = <tspan fill="#f78c6c">50</tspan></text>
<text x="32" y="131" style="animation:a3 14s infinite" xml:space="preserve"><tspan fill="#c792ea">signal</tspan> leaders = <tspan fill="#c792ea">live</tspan> <tspan fill="#22d3ee">query</tspan> <tspan fill="#ffcb6b">User</tspan> <tspan fill="#22d3ee">where</tspan> score &gt;= minScore</text>
<text x="32" y="150" style="animation:a4 14s infinite" xml:space="preserve"></text>
<text x="32" y="169" style="animation:a5 14s infinite" xml:space="preserve"><tspan fill="#c792ea">fn</tspan> <tspan fill="#82aaff">topUsers</tspan>(min: <tspan fill="#ffcb6b">int</tspan>) -&gt; <tspan fill="#ffcb6b">List</tspan>&lt;<tspan fill="#ffcb6b">User</tspan>&gt; {</text>
<text x="32" y="188" style="animation:a6 14s infinite" xml:space="preserve">    <tspan fill="#c792ea">return</tspan> <tspan fill="#22d3ee">query</tspan> <tspan fill="#ffcb6b">User</tspan> <tspan fill="#22d3ee">where</tspan> score &gt;= min</text>
<text x="32" y="207" style="animation:a7 14s infinite" xml:space="preserve">}</text>
<text x="32" y="226" style="animation:a8 14s infinite" xml:space="preserve"></text>
<text x="32" y="245" style="animation:a9 14s infinite" xml:space="preserve"><tspan fill="#c792ea">fn</tspan> <tspan fill="#82aaff">main</tspan>() {</text>
<text x="32" y="264" style="animation:a10 14s infinite" xml:space="preserve">    <tspan fill="#c792ea">let</tspan> users = <tspan fill="#82aaff">topUsers</tspan>(<tspan fill="#f78c6c">80</tspan>)</text>
<text x="32" y="283" style="animation:a11 14s infinite" xml:space="preserve">    <tspan fill="#82aaff">print</tspan>(users |&gt; <tspan fill="#82aaff">map</tspan>(<tspan fill="#c792ea">fn</tspan>(u) =&gt; u.name))</text>
<text x="32" y="302" style="animation:a12 14s infinite" xml:space="preserve">}</text>
<text x="546" y="74" style="animation:a13 14s infinite" xml:space="preserve"><tspan fill="#c792ea">import</tspan> * <tspan fill="#c792ea">as</tspan> <tspan fill="#22d3ee">$mk</tspan> <tspan fill="#c792ea">from</tspan> <tspan fill="#c3e88d">"mk-lang/runtime"</tspan>;</text>
<text x="546" y="93" style="animation:a14 14s infinite" xml:space="preserve"></text>
<text x="546" y="112" style="animation:a15 14s infinite" xml:space="preserve"><tspan fill="#c792ea">interface</tspan> <tspan fill="#ffcb6b">User</tspan> {</text>
<text x="546" y="131" style="animation:a16 14s infinite" xml:space="preserve">  id: <tspan fill="#ffcb6b">number</tspan>;</text>
<text x="546" y="150" style="animation:a17 14s infinite" xml:space="preserve">  name: <tspan fill="#ffcb6b">string</tspan>;</text>
<text x="546" y="169" style="animation:a18 14s infinite" xml:space="preserve">  score: <tspan fill="#ffcb6b">number</tspan>;</text>
<text x="546" y="188" style="animation:a19 14s infinite" xml:space="preserve">}</text>
<text x="546" y="207" style="animation:a20 14s infinite" xml:space="preserve"><tspan fill="#c792ea">const</tspan> <tspan fill="#ffcb6b">User</tspan> = <tspan fill="#22d3ee">$mk</tspan>.db.model&lt;<tspan fill="#ffcb6b">User</tspan>&gt;(<tspan fill="#c3e88d">"User"</tspan>, { id: <tspan fill="#c3e88d">"int"</tspan>, name: <tspan fill="#c3e88d">"string"</tspan>, score: <tspan fill="#c3e88d">"int"</tspan> });</text>
<text x="546" y="226" style="animation:a21 14s infinite" xml:space="preserve"></text>
<text x="546" y="245" style="animation:a22 14s infinite" xml:space="preserve"><tspan fill="#c792ea">const</tspan> minScore = <tspan fill="#22d3ee">$mk</tspan>.<tspan fill="#82aaff">signal</tspan>(<tspan fill="#f78c6c">50</tspan>);</text>
<text x="546" y="264" style="animation:a23 14s infinite" xml:space="preserve"><tspan fill="#c792ea">const</tspan> leaders = <tspan fill="#22d3ee">$mk</tspan>.<tspan fill="#82aaff">live</tspan>(<tspan fill="#ffcb6b">User</tspan>, () =&gt; <tspan fill="#22d3ee">$mk</tspan>.db.<tspan fill="#c792ea">from</tspan>(<tspan fill="#ffcb6b">User</tspan>).<tspan fill="#82aaff">where</tspan>(<tspan fill="#22d3ee">$mk</tspan>.q.<tspan fill="#82aaff">gte</tspan>(<tspan fill="#22d3ee">$mk</tspan>.q.<tspan fill="#82aaff">col</tspan>(<tspan fill="#c3e88d">"score"</tspan>), minScore.value)).<tspan fill="#82aaff">all</tspan>(), []);</text>
<text x="546" y="283" style="animation:a24 14s infinite" xml:space="preserve"><tspan fill="#c792ea">await</tspan> leaders.loaded;</text>
<text x="546" y="302" style="animation:a25 14s infinite" xml:space="preserve"></text>
<text x="546" y="321" style="animation:a26 14s infinite" xml:space="preserve"><tspan fill="#c792ea">async</tspan> <tspan fill="#c792ea">function</tspan> <tspan fill="#82aaff">topUsers</tspan>(min: <tspan fill="#ffcb6b">number</tspan>): <tspan fill="#ffcb6b">Promise</tspan>&lt;<tspan fill="#ffcb6b">User</tspan>[]&gt; {</text>
<text x="546" y="340" style="animation:a27 14s infinite" xml:space="preserve">  <tspan fill="#c792ea">return</tspan> <tspan fill="#c792ea">await</tspan> <tspan fill="#22d3ee">$mk</tspan>.db.<tspan fill="#c792ea">from</tspan>(<tspan fill="#ffcb6b">User</tspan>).<tspan fill="#82aaff">where</tspan>(<tspan fill="#22d3ee">$mk</tspan>.q.<tspan fill="#82aaff">gte</tspan>(<tspan fill="#22d3ee">$mk</tspan>.q.<tspan fill="#82aaff">col</tspan>(<tspan fill="#c3e88d">"score"</tspan>), min)).<tspan fill="#82aaff">all</tspan>();</text>
<text x="546" y="359" style="animation:a28 14s infinite" xml:space="preserve">}</text>
<text x="546" y="378" style="animation:a29 14s infinite" xml:space="preserve"></text>
<text x="546" y="397" style="animation:a30 14s infinite" xml:space="preserve"><tspan fill="#c792ea">async</tspan> <tspan fill="#c792ea">function</tspan> <tspan fill="#82aaff">main</tspan>() {</text>
<text x="546" y="416" style="animation:a31 14s infinite" xml:space="preserve">  <tspan fill="#c792ea">const</tspan> users = <tspan fill="#c792ea">await</tspan> <tspan fill="#82aaff">topUsers</tspan>(<tspan fill="#f78c6c">80</tspan>);</text>
<text x="546" y="435" style="animation:a32 14s infinite" xml:space="preserve">  console.<tspan fill="#82aaff">log</tspan>(<tspan fill="#22d3ee">$mk</tspan>.<tspan fill="#82aaff">map</tspan>(users, (u) =&gt; u.name));</text>
<text x="546" y="454" style="animation:a33 14s infinite" xml:space="preserve">}</text>
<text x="546" y="473" style="animation:a34 14s infinite" xml:space="preserve"></text>
<text x="546" y="492" style="animation:a35 14s infinite" xml:space="preserve"><tspan fill="#c792ea">await</tspan> <tspan fill="#82aaff">main</tspan>();</text>
