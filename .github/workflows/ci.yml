name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Run the canonical example
        run: node bin/mk.js run example.mk --seed examples/users.seed.json
      - name: Ownership errors are reported
        shell: bash
        run: |
          if node bin/mk.js check examples/errors/ownership.mk; then
            echo "expected compile errors" && exit 1
          fi
